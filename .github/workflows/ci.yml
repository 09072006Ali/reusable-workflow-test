name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-dev:
    uses: ./.github/workflows/reusable-test.yml
    with:
      environment: dev
      greeting: "Salam, dev!"

  test-staging:
    uses: ./.github/workflows/reusable-test.yml
    with:
      environment: staging
      greeting: "Salam, staging!"

  summary:
    runs-on: ubuntu-latest
    needs: [test-dev, test-staging]
    steps:
      - run: |
          echo "dev:     ${{ needs.test-dev.outputs.result }}"
          echo "staging: ${{ needs.test-staging.outputs.result }}"
